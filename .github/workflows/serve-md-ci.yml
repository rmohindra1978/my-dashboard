name: SERVE MD Intelligence CI

on:
  push:
    branches: [main]
    paths: ["serve-md-intelligence/**", ".github/workflows/serve-md-ci.yml"]
  pull_request:
    paths: ["serve-md-intelligence/**", ".github/workflows/serve-md-ci.yml"]

defaults:
  run:
    working-directory: serve-md-intelligence

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: serve-md-intelligence/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pipelines.build --sample
      - run: pytest -q --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serve-md-intelligence/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve-md-intelligence/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
