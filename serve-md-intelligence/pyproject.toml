[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serve-md-intelligence"
version = "0.1.0"
description = "SERVE MD Intelligence - geographic investment intelligence for Medicare-focused primary care expansion"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyshp>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "pipelines*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipelines/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/app", "pipelines"]
omit = ["*/tests/*"]
